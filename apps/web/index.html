<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Coop Blocks</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        font-family: system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      /* Container do canvas Kaplay: ocupa a tela inteira, em qualquer orientação. */
      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #000;
      }
      #app canvas {
        display: block;
        touch-action: none;
      }
      /* Overlay do HUD (criado por apps/web/src/hud.ts) */
      .hud-root {
        position: fixed;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        -webkit-user-select: none;
        user-select: none;
      }
      .hud-root > div {
        position: absolute;
        padding: 4px 10px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.55);
        white-space: nowrap;
      }
      /* Fase/mapa — canto superior esquerdo */
      .hud-root .hud-phase {
        top: max(8px, env(safe-area-inset-top));
        left: max(8px, env(safe-area-inset-left));
      }
      /* Moedas da equipe — canto superior direito */
      .hud-root .hud-coins {
        top: max(8px, env(safe-area-inset-top));
        right: max(8px, env(safe-area-inset-right));
      }
      /* Mensagem de status — centro superior */
      .hud-root .hud-status {
        top: max(8px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        border-radius: 999px;
        font-size: 13px;
      }
      /* Painel de HP dos jogadores — canto inferior esquerdo (preenchido pelo
         subtask de placar) */
      .hud-root .hud-players {
        bottom: max(8px, env(safe-area-inset-bottom));
        left: max(8px, env(safe-area-inset-left));
        display: flex;
        flex-direction: column;
        gap: 4px;
        background: none;
        padding: 0;
      }
      /* Linha do painel: nome (cor do jogador) + barra de HP + números +
         moedas individuais (badge opcional na última coluna, que colapsa
         quando o estado não fornece player.coins). A coluna do meio (barra)
         encolhe; nome, HP e moedas ficam fixos. */
      .hud-root .player-row {
        display: grid;
        grid-template-columns: auto minmax(70px, 1fr) auto auto;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid transparent;
      }
      /* Jogador local: borda clara para identificação imediata. */
      .hud-root .player-row.is-local {
        border-color: rgba(255, 255, 255, 0.85);
        outline: 1px solid rgba(255, 255, 255, 0.35);
      }
      .hud-root .player-name {
        font-weight: 700;
        font-size: 12px;
        max-width: 110px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hud-root .player-hp {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.8);
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      /* Moedas individuais — badge dourado na última coluna do grid. */
      .hud-root .player-coins {
        font-size: 11px;
        font-weight: 600;
        color: #ffd73c;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .hud-root .player-bar {
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      .hud-root .player-fill {
        height: 100%;
        border-radius: 999px;
        transition: width 0.15s linear;
      }
      /* Morto/aguardando respawn: barra e números somem, aparece a
         contagem regressiva (ou rótulo genérico de espera). */
      .hud-root .player-row.is-down .player-bar,
      .hud-root .player-row.is-down .player-hp {
        display: none;
      }
      .hud-root .player-respawn {
        grid-column: 2 / 5;
        font-size: 12px;
        font-weight: 600;
        color: #ff8a80;
        text-align: right;
      }
      /* Camada de setas de direção (preenchida pelo subtask de setas) */
      .hud-root .hud-arrows {
        inset: 0;
        background: none;
        padding: 0;
      }
      /* Seta de companheiro fora do viewport: posicionada na borda (left/top
         % definidos inline), ícone ▶ rotacionado para a direção do alvo e
         abreviatura do nome na cor do jogador. */
      .hud-root .hud-arrow {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        gap: 3px;
        padding: 2px 7px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.55);
        white-space: nowrap;
      }
      .hud-root .hud-arrow-icon {
        display: inline-block;
        font-size: 12px;
        line-height: 1;
      }
      .hud-root .hud-arrow-label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      /* Botão de mute — canto superior direito, abaixo das moedas.
         O overlay raiz tem pointer-events: none; o botão reabilita para ser
         clicável por cima do canvas. */
      .hud-root .hud-mute {
        position: absolute;
        top: max(44px, calc(env(safe-area-inset-top) + 36px));
        right: max(8px, env(safe-area-inset-right));
        padding: 6px 10px;
        border: none;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        pointer-events: auto;
        -webkit-tap-highlight-color: transparent;
      }
      .hud-root .hud-mute:hover {
        background: rgba(0, 0, 0, 0.75);
      }
      .hud-root .hud-mute:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.7);
        outline-offset: 2px;
      }
      /* ===== Loja entre fases (apps/web/src/shop.ts) =====
         Overlay full-screen que cobre o jogo quando a loja abre; some quando
         todos confirmam 'pronto'. Interativo (pointer-events: auto). */
      .shop-root {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        background: rgba(10, 10, 22, 0.92);
        color: #fff;
        font-family: system-ui, sans-serif;
        text-align: center;
        -webkit-user-select: none;
        user-select: none;
      }
      .shop-title {
        margin: 0;
        font-size: clamp(22px, 5vw, 32px);
      }
      .shop-balance {
        font-size: clamp(16px, 3vw, 20px);
        font-weight: 600;
        color: #ffd73c;
      }
      .shop-cards {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px;
      }
      .shop-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        width: clamp(140px, 22vw, 190px);
        padding: 14px 12px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
      }
      .shop-card-icon {
        font-size: 30px;
      }
      .shop-card-name {
        font-weight: 700;
        font-size: 14px;
      }
      .shop-card-desc {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.75);
        min-height: 30px;
      }
      .shop-buy {
        margin-top: auto;
        padding: 8px 14px;
        border: none;
        border-radius: 8px;
        background: #2ecc71;
        color: #062;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
      }
      .shop-buy:disabled {
        background: rgba(255, 255, 255, 0.14);
        color: rgba(255, 255, 255, 0.45);
        cursor: not-allowed;
      }
      .shop-ready-list {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        font-size: 13px;
      }
      .shop-ready-item {
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }
      .shop-ready {
        padding: 12px 34px;
        border: none;
        border-radius: 999px;
        background: #2ecc71;
        color: #062;
        font-weight: 800;
        font-size: 17px;
        cursor: pointer;
      }
      .shop-ready:disabled {
        background: rgba(255, 255, 255, 0.14);
        color: rgba(255, 255, 255, 0.55);
        cursor: wait;
      }
      .shop-error {
        padding: 6px 14px;
        border-radius: 8px;
        background: rgba(231, 76, 60, 0.25);
        color: #ff8a80;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
