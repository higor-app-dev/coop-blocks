<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Coop Blocks</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        font-family: system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      /* Container do canvas Kaplay: ocupa a tela inteira, em qualquer orientação. */
      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #000;
      }
      #app canvas {
        display: block;
        touch-action: none;
      }
      /* Overlay do HUD (criado por apps/web/src/hud.ts) */
      .hud-root {
        position: fixed;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        -webkit-user-select: none;
        user-select: none;
      }
      .hud-root > div {
        position: absolute;
        padding: 4px 10px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.55);
        white-space: nowrap;
      }
      /* Fase/mapa — canto superior esquerdo */
      .hud-root .hud-phase {
        top: max(8px, env(safe-area-inset-top));
        left: max(8px, env(safe-area-inset-left));
      }
      /* Moedas da equipe — canto superior direito */
      .hud-root .hud-coins {
        top: max(8px, env(safe-area-inset-top));
        right: max(8px, env(safe-area-inset-right));
      }
      /* Mensagem de status — centro superior */
      .hud-root .hud-status {
        top: max(8px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        border-radius: 999px;
        font-size: 13px;
      }
      /* Painel de HP dos jogadores — canto inferior esquerdo (preenchido pelo
         subtask de placar) */
      .hud-root .hud-players {
        bottom: max(8px, env(safe-area-inset-bottom));
        left: max(8px, env(safe-area-inset-left));
        display: flex;
        flex-direction: column;
        gap: 4px;
        background: none;
        padding: 0;
      }
      /* Camada de setas de direção (preenchida pelo subtask de setas) */
      .hud-root .hud-arrows {
        inset: 0;
        background: none;
        padding: 0;
      }
      /* Botão de mute — canto superior direito, abaixo das moedas.
         O overlay raiz tem pointer-events: none; o botão reabilita para ser
         clicável por cima do canvas. */
      .hud-root .hud-mute {
        position: absolute;
        top: max(44px, calc(env(safe-area-inset-top) + 36px));
        right: max(8px, env(safe-area-inset-right));
        padding: 6px 10px;
        border: none;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        pointer-events: auto;
        -webkit-tap-highlight-color: transparent;
      }
      .hud-root .hud-mute:hover {
        background: rgba(0, 0, 0, 0.75);
      }
      .hud-root .hud-mute:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.7);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
