<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Coop Blocks</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        font-family: system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      /* Container do canvas Kaplay: ocupa a tela inteira, em qualquer orientação. */
      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #000;
      }
      #app canvas {
        display: block;
        touch-action: none;
      }
      #hud {
        position: fixed;
        /* max() + env() respeita o notch em aparelhos com viewport-fit=cover */
        top: max(8px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        background: rgba(0, 0, 0, 0.55);
        padding: 4px 14px;
        border-radius: 999px;
        font-size: 13px;
        z-index: 10;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">🧱 coop-blocks — conectando ao servidor…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
